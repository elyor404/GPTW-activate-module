<div class="modal-backdrop">
  <div class="modal">
    <div class="modal__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
    </div>
    <h2 class="modal__title">Ready to Log Out?</h2>
    <p class="modal__text">
      You're about to log out of your account.<br />
      Come back anytime — your work will be saved.
    </p>
    <div class="modal__actions">
      <button type="button" class="modal__btn modal__btn--primary" (click)="onConfirm()">LOG OUT</button>
      <button type="button" class="modal__btn modal__btn--secondary" (click)="onCancel()">CANCEL</button>
    </div>
  </div>
</div>
