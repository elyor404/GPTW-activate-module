<header class="header">
  @if (headerContext.context().showDefaultHeader) {
    <button
      type="button"
      class="header__menu"
      aria-label="Open navigation menu"
      (click)="layoutUi.toggleMobileSidebar()"
    >
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <a routerLink="/dashboard" class="header__brand">
      <img src="logo.png" alt="PLUS+ - Powered by Great Place To Work" class="header__logo-img" />
    </a>

    <div class="header__search">
      <label class="visually-hidden" for="global-search">Search</label>
      <span class="header__search-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-4-4" />
        </svg>
      </span>
      <input id="global-search" class="header__search-input" type="search" placeholder="Search" autocomplete="off" />
    </div>

    <div class="header__actions">
      <button type="button" class="btn btn--outline">TRY PREMIUM</button>
      <button type="button" class="header__icon-btn" aria-label="Notifications">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7" />
          <path d="M13.73 21a2 2 0 01-3.46 0" />
        </svg>
      </button>

      <div class="header__profile-wrapper">
        <button type="button" class="header__profile" (click)="toggleDropdown()">
          <img
            class="header__avatar"
            src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80&h=80&fit=crop&crop=face"
            alt="Melisa Roberts"
            width="40"
            height="40"
          />
          <div class="header__profile-text">
            <span class="header__name">Melisa Roberts</span>
            <span class="header__org">Vention LLC</span>
          </div>
        </button>

        @if (dropdownOpen()) {
          <div class="header__dropdown">
            <button type="button" class="dropdown__item" (click)="openEditProfile()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              Edit Profile
            </button>
            <button type="button" class="dropdown__item" (click)="openLogoutModal()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Log Out
            </button>
          </div>
        }
      </div>
    </div>
  } @else {
    @if (headerContext.context().leftContent) {
      <div class="header__custom-left">
        <ng-container *ngTemplateOutlet="headerContext.context().leftContent"></ng-container>
      </div>
    }

    @if (headerContext.context().centerContent) {
      <div class="header__custom-center">
        <ng-container *ngTemplateOutlet="headerContext.context().centerContent"></ng-container>
      </div>
    }

    @if (headerContext.context().rightContent) {
      <div class="header__custom-right">
        <ng-container *ngTemplateOutlet="headerContext.context().rightContent"></ng-container>
      </div>
    }
  }
</header>

@if (showLogoutModal()) {
  <app-logout-modal
    (confirm)="confirmLogout()"
    (cancel)="cancelLogout()"
  />
}
