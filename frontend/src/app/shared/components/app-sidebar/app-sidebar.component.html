<div
  class="sidebar-backdrop"
  [class.sidebar-backdrop--visible]="layoutUi.mobileSidebarOpen()"
  (click)="layoutUi.closeMobileSidebar()"
  aria-hidden="true"
></div>

<aside
  class="sidebar"
  [class.sidebar--open-mobile]="layoutUi.mobileSidebarOpen()"
  aria-label="Main navigation"
>
  <nav class="sidebar__nav sidebar__nav--top">
    <a
      routerLink="/dashboard"
      routerLinkActive="sidebar__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar__link"
    >
      <span class="sidebar__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
          <path d="M9 22V12h6v10" />
        </svg>
      </span>
      Dashboard
    </a>

    <a routerLink="/companies" routerLinkActive="sidebar__link--active" class="sidebar__link">
      <span class="sidebar__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="20" height="14" rx="2" />
          <path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2" />
        </svg>
      </span>
      Companies
    </a>

    <a routerLink="/team-members" routerLinkActive="sidebar__link--active" class="sidebar__link">
      <span class="sidebar__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />
        </svg>
      </span>
      Team Members
    </a>

    <a routerLink="/insights" routerLinkActive="sidebar__link--active" class="sidebar__link">
      <span class="sidebar__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3v18h18" />
          <path d="M7 16l4-4 4 4 6-6" />
        </svg>
      </span>
      Insights
    </a>
  </nav>

  <div class="sidebar__divider" role="separator"></div>

  <nav class="sidebar__nav sidebar__nav--tools">
    <div class="sidebar__group">
      <button
        type="button"
        class="sidebar__link sidebar__link--toggle"
        [class.sidebar__link--active]="activateMenuOpen()"
        (click)="toggleActivateMenu()"
      >
        <span class="sidebar__icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </span>
        Activate
      </button>
      @if (activateMenuOpen()) {
        <ul id="activate-subnav" class="sidebar__subnav">
          <li>
            <a routerLink="/activate/social-posts" routerLinkActive="sidebar__sublink--active" class="sidebar__sublink">Social Posts</a>
          </li>
          <li>
            <a routerLink="/activate/activate-plus" routerLinkActive="sidebar__sublink--active" class="sidebar__sublink">Activate+</a>
          </li>
          <li>
            <a routerLink="/activate/brand-centre" routerLinkActive="sidebar__sublink--active" class="sidebar__sublink">Brand Centre</a>
          </li>
        </ul>
      }
    </div>

    <a routerLink="/elevate" routerLinkActive="sidebar__link--active" class="sidebar__link">
      <span class="sidebar__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 17l6-6 4 4 7-7" />
          <path d="M14 7h7v7" />
        </svg>
      </span>
      Elevate
    </a>

    <a routerLink="/empower" routerLinkActive="sidebar__link--active" class="sidebar__link">
      <span class="sidebar__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
      </span>
      Empower
    </a>
  </nav>

  <div class="sidebar__footer">
    <span class="sidebar__footer-label" id="ai-toggle-label">Activate AI+</span>
    <button
      type="button"
      class="toggle"
      role="switch"
      [attr.aria-checked]="layoutUi.activateAiPlusEnabled()"
      aria-labelledby="ai-toggle-label"
      (click)="layoutUi.toggleActivateAiPlus()"
    >
      <span class="toggle__thumb"></span>
    </button>
  </div>
</aside>
