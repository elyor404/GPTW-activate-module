<div class="login">
  <div class="login__banner">
    <img src="auth-banner.png" alt="" class="login__banner-img" />
  </div>

  <div class="login__form-area">
    <div class="login__form-container">
      <div class="login__brand">
        <h1 class="login__logo">PLUS+</h1>
        <p class="login__tagline">Powered by<br />Great Place To Work</p>
      </div>

      <div class="login__header">
        <h2 class="login__title">Welcome back!</h2>
        <p class="login__subtitle">Sign in to the platform to continue.</p>
      </div>

      <form class="login__form" (ngSubmit)="onSubmit()">
        @if (error()) {
          <div class="login__error">{{ error() }}</div>
        }

        <div class="form-group">
          <label class="form-label" for="email">
            <span class="form-label__required">*</span> EMAIL
          </label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="Placeholder"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <span class="form-label__required">*</span> PASSWORD
          </label>
          <div class="form-input-wrapper">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              class="form-input form-input--password"
              placeholder="Placeholder"
              [(ngModel)]="password"
              name="password"
              required
            />
            <button
              type="button"
              class="form-input__toggle"
              (click)="togglePasswordVisibility()"
              aria-label="Toggle password visibility"
            >
              @if (showPassword()) {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              } @else {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </div>
        </div>

        <div class="form-row">
          <label class="checkbox">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
            <span class="checkbox__box"></span>
            <span class="checkbox__label">REMEMBER ME</span>
          </label>
          <a href="#" class="login__forgot" (click)="$event.preventDefault()">FORGOT PASSWORD?</a>
        </div>

        <button type="submit" class="login__submit">LOG IN</button>
      </form>
    </div>
  </div>
</div>
