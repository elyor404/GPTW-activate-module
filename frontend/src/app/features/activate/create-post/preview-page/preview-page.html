<!-- Header Templates for HeaderContextService -->
<ng-template #headerLeft>
  <button class="back-btn" (click)="goBack()">BACK</button>
  <span class="project-name">{{ projectName }}</span>
</ng-template>

<ng-template #headerCenter>
  <div class="toolbar">
    <button class="tool-btn" title="Select">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
      </svg>
    </button>
    <button class="tool-btn" title="Move">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/>
      </svg>
    </button>
    <button class="tool-btn" title="Text">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M5 4v3h5.5v12h3V7H19V4H5z"/>
      </svg>
    </button>
    <button class="tool-btn" title="Image">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
      </svg>
    </button>
    <button class="tool-btn" title="Shape">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
      </svg>
    </button>
    <button class="tool-btn" title="AI">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/>
      </svg>
    </button>
  </div>
</ng-template>

<ng-template #headerRight>
  <div class="zoom-control">
    <span>Zoom</span>
  </div>
  <button class="action-btn action-btn--outline" (click)="saveDraft()">SAVE DRAFT</button>
  <button class="action-btn action-btn--outline" (click)="approve()">APPROVE</button>
  <button class="action-btn action-btn--primary" (click)="publish()">PUBLISH</button>
</ng-template>

<div class="preview-page">
  <!-- Main Preview Area -->
  <main class="preview-main">
    @if (previewData) {
      <div class="preview-content">
        <!-- Canvas Area -->
        <div class="preview-canvas" [ngClass]="getPreviewSizeClass()" [style.transform]="'scale(' + zoomLevel / 100 + ')'">
          @if (previewData.templateUrl) {
            <img [src]="previewData.templateUrl" alt="Template" class="preview-canvas__template" />
          } @else if (previewData.uploadedFiles.length > 0) {
            <img [src]="previewData.uploadedFiles[0].url" alt="Uploaded" class="preview-canvas__template" />
          } @else {
            <div class="preview-canvas__placeholder" [style.backgroundColor]="previewData.colour || '#f0f0f0'">
              <span>Preview</span>
            </div>
          }
        </div>

        <!-- Description Box -->
        <div class="preview-description">
          <p>{{ previewData.description || 'No description provided.' }}</p>
        </div>
      </div>
    } @else {
      <div class="preview-empty">
        <p>No preview data available. Please go back and select your post options.</p>
        <button class="action-btn action-btn--primary" (click)="goBack()">Go Back</button>
      </div>
    }
  </main>
</div>
